# Copy this file to mysql-secret.yaml and fill in your actual credentials.
# Do NOT commit mysql-secret.yaml — it is in .gitignore.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: donee
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: <your-root-password>
  MYSQL_DATABASE: <your-database-name>
  MYSQL_USER: <your-username>
  MYSQL_PASSWORD: <your-password>
