# Flask Todo App - Helm Values

replicaCount: 1

image:
  repository: doni502/todos
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Flask app configuration
flask:
  port: 5001
  env:
    UNSPLASH_ACCESS_KEY: ""

# MySQL configuration
mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  auth:
    # If set, use this pre-created Secret instead of creating one.
    # The referenced Secret MUST contain these keys:
    #   mysql-root-password, mysql-user, mysql-password, mysql-database
    existingSecret: ""
    rootPassword: CHANGE_ME
    database: tododb
    user: todouser
    password: CHANGE_ME
  storage:
    size: 1Gi
    storageClass: "gp2"

# Service configuration
service:
  type: ClusterIP
  port: 5001

# Ingress configuration
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:us-east-1:014032199917:certificate/3fa68cc2-a3f3-45d9-bacf-01e2b5d5037b'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
  hosts:
    - paths:
        - path: /
          pathType: Prefix
  # ALB terminates TLS via the certificate-arn annotation above,
  # so spec.tls (secret-based) is intentionally left empty.
  tls: []

# Resource limits
resources: {}
  # limits:
  #   cpu: 200m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
