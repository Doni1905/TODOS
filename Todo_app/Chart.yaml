apiVersion: v2
name: todo-app
description: A Helm chart for Flask Todo App with MySQL backend
type: application
# version = MAJOR.MINOR base you control. CI overrides PATCH with the run number
# at package time (e.g. 0.2.<run>), so bump only MAJOR or MINOR here.
#   MINOR bump (0.2 -> 0.3): new feature, auto-deploys via the ArgoCD range.
#   MAJOR bump (0.x -> 1.0): breaking change, requires widening the ArgoCD range.
version: 0.2.0
appVersion: "1.0.0"
keywords:
  - flask
  - todo
  - mysql
maintainers:
  - name: Doneeswaran
