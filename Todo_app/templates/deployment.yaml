apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "Todo_app.fullname" . }}
  labels:
    {{- include "Todo_app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "Todo_app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "Todo_app.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: flask
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.flask.port }}
              protocol: TCP
          env:
            - name: MYSQL_HOST
              value: {{ include "Todo_app.fullname" . }}-mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "Todo_app.mysqlSecretName" . }}
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "Todo_app.mysqlSecretName" . }}
                  key: mysql-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "Todo_app.mysqlSecretName" . }}
                  key: mysql-database
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "Todo_app.appSecretName" . }}
                  key: secret-key
            {{- if or .Values.unsplash.existingSecret .Values.unsplash.accessKey }}
            - name: UNSPLASH_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "Todo_app.unsplashSecretName" . }}
                  key: unsplash-access-key
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
