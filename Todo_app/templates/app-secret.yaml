{{- /*
  Flask SECRET_KEY secret.

  Skipped entirely if the user references a pre-created Secret via
  app.existingSecret. Otherwise this chart owns the Secret:
    - if app.secretKey is set, use it (stable, user-controlled)
    - else reuse the value already stored in the cluster (lookup) so upgrades
      do not rotate the key and invalidate sessions / reset tokens
    - else (first install, no value) generate a random 64-char key
*/ -}}
{{- if not .Values.app.existingSecret -}}
{{- $secretName := printf "%s-app-secret" (include "Todo_app.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $key := "" -}}
{{- if .Values.app.secretKey -}}
{{-   $key = .Values.app.secretKey -}}
{{- else if and $existing $existing.data (index $existing.data "secret-key") -}}
{{-   $key = index $existing.data "secret-key" | b64dec -}}
{{- else -}}
{{-   $key = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "Todo_app.labels" . | nindent 4 }}
type: Opaque
data:
  secret-key: {{ $key | b64enc | quote }}
{{- end }}
