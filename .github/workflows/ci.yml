name: CI - Build Image & Push Helm Chart to S3
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'docker-compose.yml'
      - 'k8s/**'
      - 'ArgoCD/**'
      - 'argocd/**'
      - 'scripts/**'
      - '.env'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'docker-compose.yml'
      - 'k8s/**'
      - 'ArgoCD/**'
      - 'argocd/**'
      - 'scripts/**'
      - '.env'

env:
  DOCKER_IMAGE: doni502/todos
  HELM_S3_BUCKET: donee-s3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: TODOS
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Docker Build & Push ───
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── AWS Credentials via OIDC ───
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::014032199917:role/donee-github-actions-helm-s3-role
          aws-region: us-east-1

      # ─── Helm Package & Push to S3 ───
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Install Helm S3 Plugin
        run: helm plugin install https://github.com/hypnoglow/helm-s3.git

      - name: Update image tag in chart
        run: |
          sed -i '0,/^  tag:/s|tag: ".*"|tag: "${{ github.sha }}"|' Todo_app/values.yaml

      - name: Update chart version
        run: |
          sed -i 's|^version: .*|version: 0.1.${{ github.run_number }}|' Todo_app/Chart.yaml
          sed -i 's|^appVersion: .*|appVersion: "1.0.${{ github.run_number }}"|' Todo_app/Chart.yaml
          echo "Chart version set to: 0.1.${{ github.run_number }}"
          echo "App version set to: 1.0.${{ github.run_number }}"
          cat Todo_app/Chart.yaml

      - name: Package Helm chart
        run: helm package ./Todo_app --destination ./helm-output

      - name: Push Helm chart to S3
        run: |
          helm repo add donee-charts s3://${{ env.HELM_S3_BUCKET }}/charts
          helm s3 push ./helm-output/todo-app-*.tgz donee-charts --force

      # ─── Update ArgoCD manifest in Git ───
      - name: Update ArgoCD application version in Git
        run: |
          CHART_VERSION="0.1.${{ github.run_number }}"
          sed -i "s|targetRevision: .*|targetRevision: \"$CHART_VERSION\"|" ArgoCD/todo-app.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ArgoCD/todo-app.yaml
          git diff --staged --quiet || git commit -m "chore: update chart version to $CHART_VERSION"
          git push
