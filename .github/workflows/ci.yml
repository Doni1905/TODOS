name: CI - Build & Push Docker Image
on:
  push:
    tags:
      # Release on semantic version tags, e.g. v1.2.3
      - 'v*.*.*'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'docker-compose.yml'
      - 'k8s/**'
      - 'ArgoCD/**'
      - 'scripts/**'
      - '.env'

env:
  DOCKER_IMAGE: doni502/todos

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: TODOS
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          # On a tag push, github.ref_name is the tag (e.g. v0.1.5).
          # Strip the leading "v" for the image/chart version. On PRs there is
          # no tag, so fall back to the short SHA (image is not pushed on PRs).
          REF="${{ github.ref_name }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${REF#v}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Derived version: $VERSION"

      # ─── Docker Build & Push ───
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Push only on tag releases; PRs build for validation but don't push.
          push: ${{ github.ref_type == 'tag' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
