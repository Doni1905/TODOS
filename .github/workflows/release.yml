name: Release - Package & Push Helm Chart to S3
on:
  workflow_run:
    workflows:
      - "CI - Build & Push Docker Image"
    types:
      - completed

env:
  HELM_S3_BUCKET: donee-s3

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    environment: TODOS
    # Only release when CI succeeded AND it was triggered by a version tag.
    # For tag runs, workflow_run.head_branch holds the tag name (e.g. v0.1.5).
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Check out the exact commit the tag pointed at (same one CI built).
          ref: ${{ github.event.workflow_run.head_sha }}

      # ─── AWS Credentials via OIDC ───
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::014032199917:role/donee-github-actions-helm-s3-role
          aws-region: us-east-1

      # ─── Helm Package & Push to S3 ───
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Install Helm S3 Plugin
        run: helm plugin install https://github.com/hypnoglow/helm-s3.git

      - name: Compute chart version
        id: chart
        run: |
          # The version comes from the git tag that triggered CI (head_branch
          # holds the tag name for tag runs), with the leading "v" stripped.
          # e.g. tag v0.1.5 -> chart/image version 0.1.5
          TAG="${{ github.event.workflow_run.head_branch }}"
          VERSION="${TAG#v}"
          echo "Release tag: $TAG"
          echo "Computed chart version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update image tag in chart
        run: |
          # Point the chart at the image published by CI for this release.
          sed -i "0,/^  tag:/s|tag: \".*\"|tag: \"${{ steps.chart.outputs.version }}\"|" Todo_app/values.yaml

      - name: Package Helm chart
        run: |
          helm package ./Todo_app \
            --version "${{ steps.chart.outputs.version }}" \
            --destination ./helm-output

      - name: Push Helm chart to S3
        run: |
          helm repo add donee-charts s3://${{ env.HELM_S3_BUCKET }}/charts
          # No --force: every version is unique, so we never overwrite a published chart.
          helm s3 push ./helm-output/todo-app-${{ steps.chart.outputs.version }}.tgz donee-charts
          echo "Pushed chart version ${{ steps.chart.outputs.version }} to S3"
          echo "Update ArgoCD targetRevision in ArgoCD/todo-app.yaml to ${{ steps.chart.outputs.version }} and apply it to sync."
