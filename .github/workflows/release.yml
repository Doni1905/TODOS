name: Release - Package & Push Helm Chart to S3
on:
  workflow_run:
    workflows:
      - "CI - Build & Push Docker Image"
    types:
      - completed

env:
  HELM_S3_BUCKET: donee-s3

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    environment: TODOS
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'release') }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::014032199917:role/donee-github-actions-helm-s3-role
          aws-region: us-east-1

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install Helm S3 Plugin
        run: helm plugin install https://github.com/hypnoglow/helm-s3.git

      - name: Compute chart version
        id: chart
        run: |
          set -euo pipefail
          TAG="$(git tag --points-at HEAD 'v*.*.*' --sort=-v:refname | head -n1)"
          if [[ -z "$TAG" ]]; then
            echo "ERROR: no vX.Y.Z tag on commit ${GITHUB_SHA:-HEAD}; cannot release." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "Release tag: $TAG"
          echo "Computed chart version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update image tag in chart
        run: |
          sed -i "0,/^  tag:/s|tag: \".*\"|tag: \"${{ steps.chart.outputs.version }}\"|" Todo_app/values.yaml

      - name: Package Helm chart
        run: |
          helm package ./Todo_app \
            --version "${{ steps.chart.outputs.version }}" \
            --destination ./helm-output

      - name: Push Helm chart to S3
        run: |
          helm repo add donee-charts s3://${{ env.HELM_S3_BUCKET }}/charts
          helm s3 push --force ./helm-output/todo-app-${{ steps.chart.outputs.version }}.tgz donee-charts
          echo "Pushed chart version ${{ steps.chart.outputs.version }} to S3"

      - name: Publish HTTPS index.yaml
        env:
          HTTPS_REPO_URL: https://${{ env.HELM_S3_BUCKET }}.s3.us-east-1.amazonaws.com/charts
        run: |
          set -euo pipefail
          mkdir -p ./index-build
          aws s3 sync "s3://${{ env.HELM_S3_BUCKET }}/charts/" ./index-build/ \
            --exclude "*" --include "*.tgz"
          helm repo index ./index-build --url "${HTTPS_REPO_URL}"
          aws s3 cp ./index-build/index.yaml "s3://${{ env.HELM_S3_BUCKET }}/charts/index.yaml" \
            --content-type "text/yaml"
          echo "Published HTTPS index.yaml pointing at ${HTTPS_REPO_URL}"
