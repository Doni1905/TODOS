apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: s3://donee-s3/charts
    chart: todo-app
    # Pinned exact version (required for s3:// repos — ArgoCD uses helm pull,
    # which is helm-s3 plugin-aware, and skips the HTTP index.yaml lookup).
    # Update this manually to the version release.yml published (0.1.<run>)
    # after each release. Do not use a SemVer range here: range resolution
    # needs an HTTP getter that cannot read s3://.
    targetRevision: "0.2.0"
    helm:
      values: |
        replicaCount: 1
        image:
          repository: doni502/todos
        mysql:
          auth:
            existingSecret: todo-app-mysql-secret
          storage:
            storageClass: gp2
        ingress:
          enabled: true
          className: alb
          annotations:
            alb.ingress.kubernetes.io/scheme: internet-facing
            alb.ingress.kubernetes.io/target-type: ip
            alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
            alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:us-east-1:014032199917:certificate/3fa68cc2-a3f3-45d9-bacf-01e2b5d5037b'
            alb.ingress.kubernetes.io/ssl-redirect: '443'
            alb.ingress.kubernetes.io/healthcheck-path: /healthz
            alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
            alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
            alb.ingress.kubernetes.io/healthy-threshold-count: '2'
            alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
          hosts:
            - host: donee.devops.tpconnects.com
              paths:
                - path: /
                  pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: donee
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
