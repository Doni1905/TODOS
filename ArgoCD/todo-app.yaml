apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app
  namespace: argocd
spec:
  project: default
  source:
    # HTTPS S3 static website / REST endpoint for the Helm repo. ArgoCD's
    # built-in HTTP getter reads charts/index.yaml directly, so NO helm-s3
    # plugin is required on the repo-server. The charts/ prefix must be
    # readable over HTTPS (anonymous s3:GetObject) for this to work.
    repoURL: https://donee-s3.s3.us-east-1.amazonaws.com/charts
    chart: todo-app
    # With an HTTP getter, SemVer ranges resolve again via index.yaml. The
    # release pipeline still pins this to the exact published version, but a
    # range would also work here now.
    targetRevision: "2.0.3"
    helm:
      values: |
        replicaCount: 1
        image:
          repository: doni502/todos
        mysql:
          auth:
            existingSecret: todo-app-mysql-secret
          storage:
            storageClass: gp2
        ingress:
          enabled: true
          className: alb
          annotations:
            alb.ingress.kubernetes.io/scheme: internet-facing
            alb.ingress.kubernetes.io/target-type: ip
            alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
            alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:us-east-1:014032199917:certificate/3fa68cc2-a3f3-45d9-bacf-01e2b5d5037b'
            alb.ingress.kubernetes.io/ssl-redirect: '443'
            alb.ingress.kubernetes.io/healthcheck-path: /healthz
            alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
            alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
            alb.ingress.kubernetes.io/healthy-threshold-count: '2'
            alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
          hosts:
            - host: donee.devops.tpconnects.com
              paths:
                - path: /
                  pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: donee
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
