apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: s3://donee-s3/charts
    chart: todo-app
    # SemVer range: ArgoCD auto-deploys the newest chart in the 0.x line.
    # A deliberate 1.0.0 (breaking) will NOT auto-deploy until this range is widened.
    targetRevision: ">=0.2.0 <1.0.0"
    helm:
      values: |
        replicaCount: 1
        image:
          repository: doni502/todos
        mysql:
          auth:
            existingSecret: todo-app-mysql-secret
          storage:
            storageClass: gp2
  destination:
    server: https://kubernetes.default.svc
    namespace: donee
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
