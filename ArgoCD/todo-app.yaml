apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: s3://donee-s3/charts
    chart: todo-app
    # Pinned exact version (required for s3:// repos — ArgoCD uses helm pull,
    # which is helm-s3 plugin-aware, and skips the HTTP index.yaml lookup).
    # Update this manually to the version release.yml published (0.1.<run>)
    # after each release. Do not use a SemVer range here: range resolution
    # needs an HTTP getter that cannot read s3://.
    targetRevision: "0.1.0"
    helm:
      values: |
        replicaCount: 1
        image:
          repository: doni502/todos
        mysql:
          auth:
            existingSecret: todo-app-mysql-secret
          storage:
            storageClass: gp2
  destination:
    server: https://kubernetes.default.svc
    namespace: donee
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
