apiVersion: v1
kind: Secret
metadata:
  name: donee-s3-charts-http
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: donee-s3-charts-http
  type: helm
  # S3 virtual-hosted-style HTTPS endpoint — no helm-s3 plugin needed.
  # The bucket must serve index.yaml at this path for Helm repo resolution.
  url: https://donee-s3.s3.us-east-1.amazonaws.com/charts
  enableOCI: "false"
