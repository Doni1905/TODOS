# Strategic-merge patch for a raw-manifest Argo CD install (kubectl apply).
#
# The stock Argo CD repo-server image already bundles the helm-s3 plugin at
# /helm-plugins/helm-s3 with HELM_PLUGINS=/helm-plugins. So NO init container
# is needed. Earlier failures were caused by us overriding HELM_PLUGINS to a
# path where nothing was installed. This patch is intentionally a no-op stub
# kept for documentation; the real fix is to REMOVE the init container / env /
# volume we previously added (see cleanup-patch.json).
#
# If you want to force a specific newer plugin version instead of the bundled
# one, use cleanup-patch.json PLUS a single-copy install (remove the bundled
# dir in the init container before installing).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
