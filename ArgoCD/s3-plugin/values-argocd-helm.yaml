# Argo CD Helm chart override (argo/argo-cd) to add the helm-s3 plugin
# to the repo-server so it can resolve s3:// Helm repositories.
#
# Apply with:
#   helm repo add argo https://argoproj.github.io/argo-helm
#   helm upgrade --install argocd argo/argo-cd -n argocd -f values-argocd-helm.yaml
#
# Notes:
# - We run `helm plugin install` in the init container. This downloads the
#   correct Linux binary AND registers plugin.yaml, so Helm actually learns
#   the s3:// protocol. A bare `wget | tar` does NOT register the plugin.
# - HELM_PLUGINS + HELM_DATA_HOME point the main container at the shared volume.

repoServer:
  # The main repo-server container needs to know where the plugin lives.
  env:
    - name: HELM_PLUGINS
      value: /helm-plugins/helm/plugins
    - name: HELM_DATA_HOME
      value: /helm-plugins/helm

  initContainers:
    - name: install-helm-s3-plugin
      # Use an image that already has helm + git + ca-certs available.
      image: alpine/helm:3.16.2
      env:
        - name: HELM_DATA_HOME
          value: /helm-plugins/helm
        # Pin the plugin version for reproducible builds.
        - name: HELM_S3_VERSION
          value: "0.17.2"
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          apk add --no-cache git curl >/dev/null 2>&1 || true
          mkdir -p /helm-plugins/helm/plugins
          # Installs the binary and registers plugin.yaml under HELM_DATA_HOME.
          helm plugin install https://github.com/hypnoglow/helm-s3.git --version "v${HELM_S3_VERSION}"
          helm plugin list
      volumeMounts:
        - name: helm-plugins
          mountPath: /helm-plugins

  volumeMounts:
    - name: helm-plugins
      mountPath: /helm-plugins

  volumes:
    - name: helm-plugins
      emptyDir: {}
