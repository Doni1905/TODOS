# Example pre-existing MySQL Secret for the Todo App Helm chart.
#
# This is an EXAMPLE only. Do NOT commit real credentials.
# Usage:
#   1. Copy this file to a real (git-ignored) file:
#        cp Todo_app/mysql-existing-secret.example.yaml Todo_app/mysql-secret.local.yaml
#   2. Fill in the real values below.
#   3. Apply it to the cluster:
#        kubectl apply -f Todo_app/mysql-secret.local.yaml
#   4. Reference it from the chart via mysql.auth.existingSecret: todo-app-mysql-secret
#
# The Secret MUST contain these keys (they match the chart's generated Secret):
#   mysql-root-password, mysql-user, mysql-password, mysql-database
apiVersion: v1
kind: Secret
metadata:
  name: todo-app-mysql-secret
  namespace: donee
type: Opaque
stringData:
  mysql-root-password: CHANGE_ME_ROOT_PASSWORD
  mysql-user: CHANGE_ME_USER
  mysql-password: CHANGE_ME_PASSWORD
  mysql-database: CHANGE_ME_DATABASE
